<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow Example</title>
</head>
<style>
    #box{
        border: 1px solid black;
        overflow: auto;
    }

    #box1{
        width: 200px;
        height: 200px;
        margin: 2px;
        background-color: aquamarine;
        border: 1px solid red;
        float: left;
    }
</style>
<body>
    <div id="box">
        <div id="box1">A</div>
        <div id="box1">B</div>
        <div id="box1">C</div>
    </div>
</body>
</html>
