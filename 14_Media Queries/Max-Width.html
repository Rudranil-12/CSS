<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries Max Width</title>
    <style>
        .box{
            height: 500px;
            width: 500px;
            background-color: aqua;
            border: 5px solid black;
        }

        @media (max-width:500px) {
            .box{
                background-color: red;
            }
            /* in less then 500px width the background-color: will be aqua */
        }
    </style>
</head>
<body>
    <div>
        <div class="box">
            RUDRANIL MALLICK
        </div>
    </div>
</body>
</html>
