<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            width: 102vw;
            height: 100vh;
            background-color: beige;
            border: 5px solid black;
        }

        .box{
            height: 80px;
            width: 350px;
            background-color: blueviolet;
            border: 1pz solid brown;
            border-radius: 10px;
            position: relative;
            margin: 10px;
        }

        .box1{
            height: 80px;
            width: 350px;
            background-color: blueviolet;
            border: 1pz solid brown;
            border-radius: 10px;
            position: relative;
            margin: 10px;
        }

        .circle{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            border: 1pz solid brown;
            border-radius: 50px;
            position: relative;
            margin: 10px;
            top: 30%;
            left: 40%;
        }

        .box{
            /* @keyframes duration | easing-function | delay | iteration-count | direction | fill-mode | play-state | name*/
            animation: 5s linear 1s infinite alternate none running rightmovement;
        }

        .box1{
            animation: 5s ease-in 1s infinite alternate none running leftmovement;
        }

        .circle{
            animation: 10s ease-in-out 0s infinite alternate-reverse none running circlemovement;;
        }

        @keyframes rightmovement {
            from {
                top: 0;
                left: 0;
            }
            to{
                top: 0;
                left: 1200px;
            }
        }

        @keyframes leftmovement{
            from{
                top: 480px;
                left: 1200px;
            }
            to{
                top: 480px;
                left: 0;
            }
        }

         @keyframes circlemovement{
            0%{
                top: 1%;
                left: 5%;
            }
            30%{
                top: 5%;
                left: 90%;
            }
            60%{
                top: 70%;
                left: 10%;
            }
            100%{
                top: 75%;
                left: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="circle"></div>
        <div class="box1"></div>
        
    </div>
</body>
</html>
