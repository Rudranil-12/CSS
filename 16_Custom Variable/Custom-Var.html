<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Variables</title>
    <style>
        .container{
            background-color: beige;
            height: 650px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            --primary-color: blueviolet;
            --custom-width: 330px;
            --custom-height: 330px;
            --secondary-color: brown;
        }

        .box{
            background-color: var(--primary-color);
            width: var(--custom-width);
            height: var(--custom-height);
            border: 1px solid var(--secondary-color);
            margin: 5px;
            padding: 5px;
            box-shadow: 10px 15px var(--secondary-color);
        }

        .box img{
            height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="Logo 2.png" alt="">
            <h2>Rudranil Mallick</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Explicabo, 
                quisquam reiciendis tempore saepe sed possimus obcaecati, consectetur 
                officiis deleniti, iusto assumenda labore odio soluta doloribus.</p>
        </div>
    </div>
</body>
</html>
