<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Blur and Shadow Effects</title>
    <style>
        .container{
            background-color: beige;
            height: 650px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            background-color: blueviolet;
            width: 330px;
            height: 330px;
            border: 1px solid brown;
            margin: 5px;
            padding: 5px;
        }

        #head1{
            text-shadow: 2px 2px 5px red;
        }

        #para{
            text-shadow: white 12px 13px 1px;
        }

        .box img{
            height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="Logo 2.png" alt="">
            <h2 id="head1">Rudranil Mallick</h2>
            <p id="para">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Explicabo, 
                quisquam reiciendis tempore saepe sed possimus obcaecati, consectetur 
                officiis deleniti, iusto assumenda labore odio soluta doloribus.</p>
        </div>
    </div>
</body>
</html>
