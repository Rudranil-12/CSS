<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2d Transform</title>
    <style>
        .container{
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
        }

        .box{
            width: 400px;
            height: 400px;
            background-color: beige;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: auto;

            transition: all 2s linear 1s;  /*TRANSITION IS FOR SMOOTHNESS*/
        }

        .box:hover{
            transform: scale(0.5);
        }

        p{
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        <p>This is a box</p>
    </div>
    </div>
</body>
</html>
