<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Element Example</title>
</head>
<body>
    <style>
        span{
            border: 1px solid green;
            width: 800px;
            height: 500px;
            margin: 10px;
            padding: 15px;

            display: block;  /* TO CHANGE THE INLINE ELEMENT INTO BLOCK ELEMENT WE USE THIS */
        } 
    </style>

    <span>
        This is Rudranil
    </span>

    <span>
        This is Roni Mallick
    </span>

</body>
</html>
